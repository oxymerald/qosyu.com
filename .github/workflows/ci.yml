name: CI

on:
  push:
    branches: [main, "oxy/**"]
  pull_request:
    branches: [main]

jobs:
  unit-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-test.txt ruff
      - name: Lint Python with ruff
        run: ruff check --output-format=github app tests
      - name: Run Python unit tests
        working-directory: app
        run: |
          python - <<'PY'
          import sys, unittest
          suite = unittest.defaultTestLoader.discover("../tests", pattern="test_*.py")
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          for test, tb in result.failures + result.errors:
              last = [line.strip() for line in tb.strip().splitlines() if line.strip()][-1]
              print(f"::error title={test}::{last}")
          sys.exit(0 if result.wasSuccessful() else 1)
          PY

  frontend-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Syntax-check JS files
        run: |
          for f in app/static/js/*.js; do
            node --check "$f"
          done
      - name: Run demo sandbox tests
        run: node --test tests/test_demo.cjs
      - name: Verify i18n parity and CSS integrity
        run: |
          python3 - <<'PY'
          import pathlib, re
          root = pathlib.Path(".")
          i18n = (root / "app/static/js/i18n.js").read_text(encoding="utf-8")
          pub = (root / "app/static/js/public.js").read_text(encoding="utf-8")
          blocks = {l: re.search(rf'\n  {l}: \{{(.*?)\n  \}},', i18n, re.S).group(1) for l in ("ru", "en", "kk")}
          keys = {}
          for l, b in blocks.items():
              ks = re.findall(r'"([a-zA-Z0-9_.-]+)"\s*:', b)
              assert len(ks) == len(set(ks)), f"Duplicate i18n keys in {l}"
              keys[l] = set(ks)
          assert keys["ru"] == keys["en"] == keys["kk"], "i18n locale mismatch"
          defined = keys["ru"] | set(re.findall(r'"([a-zA-Z0-9_.-]+)"\s*:', pub))
          html = (root / "app/static/index.html").read_text(encoding="utf-8")
          used = set(re.findall(r'data-i18n(?:-ph)?="([^"]+)"', html))
          for p in (root / "app/static/js").glob("*.js"):
              used.update(re.findall(r'\bt\("([a-zA-Z0-9_.-]+)"\)', p.read_text(encoding="utf-8")))
          missing = sorted(k for k in used if k not in defined)
          assert not missing, f"Missing i18n keys: {missing}"
          css = (root / "app/static/css/app.css").read_text(encoding="utf-8")
          assert css.count("{") == css.count("}"), "Unbalanced CSS braces"
          PY

  integration-postgis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start isolated PostGIS + Redis test stack
        run: docker compose -p qosyu-ci -f compose.test.yml up -d --build --wait
      - name: Install SQLite test driver inside backend container
        run: docker compose -p qosyu-ci -f compose.test.yml exec -T backend python -m pip install --user --no-cache-dir aiosqlite==0.21.0
      - name: Run full integration test suite
        run: |
          docker compose -p qosyu-ci -f compose.test.yml exec -T backend python - <<'PY'
          import sys, unittest
          suite = unittest.defaultTestLoader.discover("/tests", pattern="test_*.py")
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          for test, tb in result.failures + result.errors:
              last = [line.strip() for line in tb.strip().splitlines() if line.strip()][-1]
              print(f"::error title={test}::{last}")
          sys.exit(0 if result.wasSuccessful() else 1)
          PY
      - name: Tear down test stack
        if: always()
        run: docker compose -p qosyu-ci -f compose.test.yml down -v
