services:
  db:
    image: postgis/postgis:15-3.4
    environment:
      TELEGRAM_BOT_TOKEN: 8682827104:AAEIWbKlGlhq53A7kPwX2ZRjDXLAdggfZR0
      POSTGRES_USER: qosyu
      POSTGRES_PASSWORD: qosyu
      POSTGRES_DB: qosyu
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qosyu -d qosyu"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: .
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      PYTHONPATH: /app
      DATABASE_URL: postgresql+asyncpg://qosyu:qosyu@db:5432/qosyu
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: my-super-secret-key-for-qosyu-2024
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 43200
    volumes:
      - ./app:/app
    working_dir: /app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  pgdata: